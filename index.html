<!-- ======================== index.html ======================== -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scalper Control — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0e0e10;     /* fallback */
      --txt: #ffffff;    /* fallback */
      --muted: #9aa0a6;  /* fallback */
      --btn: #2d7ef7;    /* fallback */
      --ok: #12d27c;     /* green */
      --bad: #ff5a5f;    /* red */
      --line: rgba(255,255,255,.07);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--txt);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }

    /* ===== HEADER ===== */
    .header {
      height: 70px;
      background: var(--btn);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center; /* центрируем по горизонтали */
      padding: calc(env(safe-area-inset-top, 0px)) 16px 0 16px;
    }
    .header-title { font-weight: 800; letter-spacing: .2px; text-align: center; width: 100%; }

    /* ===== LAYOUT: edge-to-edge ===== */
    .wrap { width: 100%; margin: 0; padding: 0; }
    .section { padding: 14px 16px; }
    .section + .section { border-top: 1px solid var(--line); }

    .muted { color: var(--muted); font-size: 14px; }

    /* ===== ACTIONS ===== */
    .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .actions button {
      appearance: none; border: 0; border-radius: 12px; padding: 12px 0; cursor: pointer;
      background: var(--btn); color: #fff; font-weight: 700; font-size: 14px; width: 100%;
    }

    /* ===== POSITIONS ===== */
    .positions-header { display: flex; justify-content: space-between; align-items: center; }
    .list { display: grid; }
    .item { display: grid; grid-template-columns: 1.1fr .6fr .6fr auto; align-items: center; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--line); }
    .item:first-child { border-top: 0; }
    .sym { font-weight: 700; letter-spacing: .3px; }
    .pnl { font-variant-numeric: tabular-nums; }
    .pnl.positive { color: var(--ok); }
    .pnl.negative { color: var(--bad); }
    .hold { font-variant-numeric: tabular-nums; color: var(--muted); }
    .close { background: rgba(255,255,255,.06); border: 0; color: var(--txt); padding: 8px 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <header class="header">
    <div id="total-pnl" class="header-title">total pnl: 0.00%</div>
  </header>
  <div class="wrap">
    <!-- ACTIONS (edge-to-edge) -->
    <section class="section">
      <div class="actions">
        <button id="btn-status">Status</button>
        <button id="btn-stop">Stop</button>
        <button id="btn-run">Run</button>
        <button id="btn-ref">Ref</button>
      </div>
    </section>

    <!-- POSITIONS (edge-to-edge) -->
    <section class="section">
      <div class="positions-header">
        <div style="font-weight:700">Active positions</div>
        <div class="muted" id="positions-count">0</div>
      </div>
      <div class="list" id="positions-list"></div>
    </section>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    // Theme
    function applyTheme(tp = tg?.themeParams || {}) {
      const map = {
        '--bg': tp.bg_color,
        '--txt': tp.text_color,
        '--muted': tp.hint_color,
        '--btn': tp.button_color,
        '--ok': tp.link_color || '#12d27c'
      };
      for (const k in map) if (map[k]) document.documentElement.style.setProperty(k, map[k]);
    }

    // Utils
    function send(cmd, extra = {}) {
      const payload = JSON.stringify({ cmd, ...extra });
      if (!tg) { console.log('[debug send]', payload); return; }
      tg.sendData(payload);
    }
    function pad(n){ return String(n).padStart(2,'0'); }
    function fmtDuration(ms){
      ms = Math.max(0, ms|0);
      const s = Math.floor(ms/1000);
      const h = Math.floor(s/3600);
      const m = Math.floor((s%3600)/60);
      const ss = s%60;
      return `${pad(h)}:${pad(m)}:${pad(ss)}`;
    }

    // Positions state (ожидаем, что ты заменишь это получением с бэкенда/бота)
    let positions = [];

    function setPositions(arr){
      positions = Array.isArray(arr) ? arr : [];
      renderPositions();
    }

    function renderPositions(){
      const root = document.getElementById('positions-list');
      const cnt = document.getElementById('positions-count');
      root.innerHTML = '';
      cnt.textContent = positions.length;
      positions.forEach((p) => {
        const row = document.createElement('div');
        row.className = 'item';
        const pnlClass = (p.pnl ?? 0) >= 0 ? 'positive' : 'negative';
        row.innerHTML = `
          <div class="sym">${p.symbol}</div>
          <div class="pnl ${pnlClass}">${(p.pnl>=0?'+':'')}${(p.pnl*100).toFixed(2)}%</div>
          <div class="hold" data-start="${p.open_ts || Date.now()}">00:00:00</div>
          <button class="close" data-symbol="${p.symbol}">close</button>
        `;
        root.appendChild(row);
      });
      // attach close handlers
      root.querySelectorAll('.close').forEach(btn => {
        btn.onclick = () => {
          const sym = btn.getAttribute('data-symbol');
          send('close', { symbol: sym });
        };
      });
      // total pnl header update
      try {
        const total = positions.reduce((s,p)=> s + (Number(p.pnl)||0), 0);
        const el = document.getElementById('total-pnl');
        if (el) {
          const sign = total > 0 ? '+' : total < 0 ? '' : '';
          el.textContent = `total pnl: ${sign}${(total*100).toFixed(2)}%`;
          el.style.color = total > 0 ? 'var(--ok)' : total < 0 ? 'var(--bad)' : '#fff';
        }
      } catch(_) {}
      // initial update of timers
      updateHolds();
    }

    function updateHolds(){
      const now = Date.now();
      document.querySelectorAll('.hold[data-start]').forEach(el => {
        const t0 = Number(el.getAttribute('data-start')) || now;
        el.textContent = fmtDuration(now - t0);
      });
    }
    setInterval(updateHolds, 1000);

    function init(){
      if (tg){
        tg.ready();
        tg.expand();
        applyTheme();
        tg.onEvent('themeChanged', () => applyTheme());
        try { tg.MainButton.hide(); } catch(e) {}
      }

      // top actions
      document.getElementById('btn-status').onclick = () => send('status');
      document.getElementById('btn-stop').onclick   = () => send('stop');
      document.getElementById('btn-run').onclick    = () => send('run');
      document.getElementById('btn-ref').onclick    = () => { send('positions'); };

      // demo data if not inside Telegram
    //  if (!tg) {
        setPositions([
          { symbol:'BTCUSDT', pnl: +0.0134, open_ts: Date.now() - 2_500_000 },
          { symbol:'ETHUSDT', pnl: -0.0042, open_ts: Date.now() - 640_000 },
          { symbol:'SOLUSDT', pnl: +0.0069, open_ts: Date.now() - 12_000 },
          { symbol:'BTCUSDT', pnl: +0.0134, open_ts: Date.now() - 2_500_000 },
          { symbol:'ETHUSDT', pnl: -0.0042, open_ts: Date.now() - 640_000 },
          { symbol:'SOLUSDT', pnl: +0.0069, open_ts: Date.now() - 12_000 },
          { symbol:'BTCUSDT', pnl: +0.0134, open_ts: Date.now() - 2_500_000 },
          { symbol:'ETHUSDT', pnl: -0.0042, open_ts: Date.now() - 640_000 },
          { symbol:'SOLUSDT', pnl: +0.0069, open_ts: Date.now() - 12_000 },
          { symbol:'SOLUSDT', pnl: +0.0069, open_ts: Date.now() - 12_000 },
        ]);
   //   }
    }
