<!-- ======================== index.html ======================== -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scalper Control — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0e0e10;     /* fallback */
      --txt: #ffffff;    /* fallback */
      --muted: #9aa0a6;  /* fallback */
      --card: #1a1b1e;   /* fallback */
      --btn: #2d7ef7;    /* fallback */
      --ok: #12d27c;     /* green */
      --bad: #ff5a5f;    /* red */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--txt);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    .wrap { width: 100%; margin: 0; padding: 12px 0 24px; }
    .card { background: transparent; border-radius: 0; padding: 16px; margin: 0; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .muted { color: var(--muted); font-size: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      appearance: none; border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer;
      background: var(--btn); color: white; font-weight: 600; font-size: 14px;
    }
    .btn-ghost { background: rgba(255,255,255,.06); border: 0; color: var(--txt); }

    /* ===== positions list ===== */
    .positions-header { display: flex; justify-content: space-between; align-items: center; }
    .list { display: grid; gap: 8px; }
    .item { display: grid; grid-template-columns: 1.1fr .6fr .6fr auto; align-items: center; gap: 8px; padding: 14px 16px; }
    .sym { font-weight: 700; letter-spacing: .3px; }
    .pnl { font-variant-numeric: tabular-nums; }
    .pnl.positive { color: var(--ok); }
    .pnl.negative { color: var(--bad); }
    .hold { font-variant-numeric: tabular-nums; color: var(--muted); }
    .close { background: rgba(255,255,255,.06); border: 0; color: var(--txt); padding: 8px 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Scalper Control</h1>
      <div class="muted">Mini App (GitHub Pages). Открыл: <span id="who">—</span></div>
    </div>

    <!-- top actions -->
    <div class="card">
      <div class="row">
        <button id="btn-status">ℹ️ Status</button>
        <button id="btn-stop" class="btn-ghost">⏹ Stop</button>
        <button id="btn-run">▶️ Run</button>
        <button id="btn-ref" class="btn-ghost">🔄 Ref</button>
      </div>
    </div>

    <!-- active positions -->
    <div class="card">
      <div class="positions-header">
        <div style="font-weight:700">Active positions</div>
        <div class="muted" id="positions-count">0</div>
      </div>
      <div class="list" id="positions-list"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    // Theme
    function applyTheme(tp = tg?.themeParams || {}) {
      const map = {
        '--bg': tp.bg_color,
        '--txt': tp.text_color,
        '--muted': tp.hint_color,
        '--card': tp.secondary_bg_color,
        '--btn': tp.button_color,
        '--ok': tp.link_color || '#12d27c'
      };
      for (const k in map) if (map[k]) document.documentElement.style.setProperty(k, map[k]);
    }

    // Utils
    function send(cmd, extra = {}) {
      const payload = JSON.stringify({ cmd, ...extra });
      if (!tg) { console.log('[debug send]', payload); return; }
      tg.sendData(payload);
    }
    function pad(n){ return String(n).padStart(2,'0'); }
    function fmtDuration(ms){
      ms = Math.max(0, ms|0);
      const s = Math.floor(ms/1000);
      const h = Math.floor(s/3600);
      const m = Math.floor((s%3600)/60);
      const ss = s%60;
      return `${pad(h)}:${pad(m)}:${pad(ss)}`;
    }

    // Positions state (ожидаем, что ты заменишь это получением с бэкенда/бота)
    let positions = [];

    function setPositions(arr){
      positions = Array.isArray(arr) ? arr : [];
      renderPositions();
    }

    function renderPositions(){
      const root = document.getElementById('positions-list');
      const cnt = document.getElementById('positions-count');
      root.innerHTML = '';
      cnt.textContent = positions.length;
      positions.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'item';
        const pnlClass = (p.pnl ?? 0) >= 0 ? 'positive' : 'negative';
        row.innerHTML = `
          <div class="sym">${p.symbol}</div>
          <div class="pnl ${pnlClass}">${(p.pnl>=0?'+':'')}${(p.pnl*100).toFixed(2)}%</div>
          <div class="hold" data-start="${p.open_ts || Date.now()}">00:00:00</div>
          <button class="close" data-symbol="${p.symbol}">close</button>
        `;
        root.appendChild(row);
      });
      // attach close handlers
      root.querySelectorAll('.close').forEach(btn => {
        btn.onclick = () => {
          const sym = btn.getAttribute('data-symbol');
          send('close', { symbol: sym });
        };
      });
      // initial update of timers
      updateHolds();
    }

    function updateHolds(){
      const now = Date.now();
      document.querySelectorAll('.hold[data-start]').forEach(el => {
        const t0 = Number(el.getAttribute('data-start')) || now;
        el.textContent = fmtDuration(now - t0);
      });
    }
    setInterval(updateHolds, 1000);

    function init(){
      if (tg){
        tg.ready();
        tg.expand();
        applyTheme();
        tg.onEvent('themeChanged', () => applyTheme());
        const user = tg.initDataUnsafe?.user;
        document.getElementById('who').textContent = user ? `${user.first_name} (${user.id})` : 'unknown';
        try { tg.MainButton.hide(); } catch(e) {}
      } else {
        document.getElementById('who').textContent = 'outside Telegram (debug)';
      }

      // top actions
      document.getElementById('btn-status').onclick = () => send('status');
      document.getElementById('btn-stop').onclick   = () => send('stop');
      document.getElementById('btn-run').onclick    = () => send('run');
      document.getElementById('btn-ref').onclick    = () => { send('positions'); };

      // demo data if not inside Telegram
     // if (!tg) {
        setPositions([
          { symbol:'BTCUSDT', pnl: +0.0134, open_ts: Date.now() - 2_500_000 },
          { symbol:'ETHUSDT', pnl: -0.0042, open_ts: Date.now() - 640_000 },
          { symbol:'SOLUSDT', pnl: +0.0069, open_ts: Date.now() - 12_000 },
        ]);
      }
 //   }

    init();
  </script>
</body>
</html>
